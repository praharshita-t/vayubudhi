name: Refresh CPCB station observations
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpcb-station-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official CPCB readings through the backend
        env:
          INGESTION_API_URL: https://vayubudhi-preview-api.onrender.com
          INGESTION_TRIGGER_SECRET: ${{ secrets.INGESTION_TRIGGER_SECRET }}
        run: python scripts/refresh_cpcb.py
