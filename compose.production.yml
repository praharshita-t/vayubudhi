name: ${COMPOSE_PROJECT_NAME:-vayubudhi}

x-backend: &backend
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the release image}
  env_file: .env
  environment:
    APP_ENV: production
    SEED_DEMO_USERS: 'false'
    INGESTION_ENABLED: 'false'
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayubudhi}
      POSTGRES_USER: ${POSTGRES_USER:-vayuuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: 'no'
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8000/api/health']
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 6
  ingestion:
    <<: *backend
    command: [python, -m, app.ingestion.worker]
    healthcheck:
      test: [CMD, python, -c, "from app.redis_client import get_cache; raise SystemExit(0 if get_cache('ingestion:heartbeat') else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the release image}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    depends_on:
      backend: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
