# Local development. Production uses compose.production.yml.
name: vayubudhi-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vayubudhi
      POSTGRES_USER: vayuuser
      POSTGRES_PASSWORD: local-development-only
    volumes: [dev_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vayuuser -d vayubudhi']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &env
      DATABASE_URL: postgresql://vayuuser:local-development-only@db:5432/vayubudhi
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: local-development-only-not-for-production
      INGESTION_ENABLED: 'false'
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *env
      DATAGOV_API_KEY: ${DATAGOV_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGINS: http://localhost:3000
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *env
      DATAGOV_API_KEY: ${DATAGOV_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    command: [python, -m, app.ingestion.worker]
    healthcheck: {disable: true}
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  dev_postgres:
